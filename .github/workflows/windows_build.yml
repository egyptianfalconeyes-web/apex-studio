name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller PyQt5 edge-tts arabic-reshaper python-bidi Pillow google-genai

    - name: Build Executable with PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --windowed --icon=NONE --name "Apex_Master_Studio" main.py

    - name: Upload Windows EXE
      uses: actions/upload-artifact@v4
      with:
        name: Apex-Studio-Windows-Program
        path: dist/*.exe
